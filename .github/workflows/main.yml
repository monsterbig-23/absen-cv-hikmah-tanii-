name: Build APK Absen CV Hikmah Tani

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cari file ZIP proyek
        shell: bash
        run: |
          set -e

          echo "=== FILE DI REPOSITORY ==="
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname '*ONLINE_FIREBASE_TERHUBUNG*.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f \
              -iname '*.zip' \
              -print -quit)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP proyek Android tidak ditemukan."
            exit 1
          fi

          echo "ZIP yang akan dibuild: $ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ekstrak proyek Android
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "=== STRUKTUR PROYEK ==="
          find project -maxdepth 4 -type f | sort | head -300

          PROJECT_DIR=$(find project \
            -type f \
            -name 'settings.gradle*' \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyek ditemukan di:"
          echo "$PROJECT_DIR"

      - name: Aktifkan AndroidX
        shell: bash
        run: |
          set -e

          touch "$PROJECT_DIR/gradle.properties"

          if ! grep -q '^android.useAndroidX=' "$PROJECT_DIR/gradle.properties"; then
            echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"
          else
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROJECT_DIR/gradle.properties"
          fi

          if ! grep -q '^android.enableJetifier=' "$PROJECT_DIR/gradle.properties"; then
            echo 'android.enableJetifier=true' >> "$PROJECT_DIR/gradle.properties"
          else
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' \
              "$PROJECT_DIR/gradle.properties"
          fi

          echo "=== gradle.properties ==="
          cat "$PROJECT_DIR/gradle.properties"

      - name: Cek Firebase
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "ERROR: google-services.json tidak ditemukan."
            echo "Pastikan file Firebase berada di folder app/."
            exit 1
          fi

          echo "google-services.json ditemukan."

      - name: Periksa Gradle
        shell: bash
        run: |
          set -e

          echo "=== SETTINGS ==="
          cat "$PROJECT_DIR/settings.gradle" 2>/dev/null || \
          cat "$PROJECT_DIR/settings.gradle.kts"

          echo ""
          echo "=== APP BUILD GRADLE ==="
          cat "$PROJECT_DIR/app/build.gradle" 2>/dev/null || \
          cat "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "       MULAI BUILD APK"
          echo "================================"

          gradle assembleDebug --no-daemon

          echo ""
          echo "================================"
          echo "       APK HASIL BUILD"
          echo "================================"

          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Tampilkan SHA-1
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "          SHA-1 DEBUG"
          echo "================================"

          if [ -f "$HOME/.android/debug.keystore" ]; then

            keytool -list -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android | grep -E "SHA1:"

          else

            echo "debug.keystore belum ditemukan."
            echo "Mencoba menggunakan signingReport..."

            cd "$PROJECT_DIR"

            gradle signingReport --no-daemon || true

          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Absen-CV-Hikmah-Tani-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
