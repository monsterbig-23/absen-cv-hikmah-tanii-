name: Build APK Absen CV Hikmah Tani

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cek file ZIP
        shell: bash
        run: |
          set -e

          echo "=== FILE DI REPOSITORY ==="
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname 'Absen_CV_Hikmah_Tani_FINAL_PERBAIKAN.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f \
              -iname '*.zip' \
              -print -quit)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tidak ada file ZIP proyek Android."
            exit 1
          fi

          echo "ZIP yang akan dibuild: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo ""
          echo "=== ISI ZIP ==="
          unzip -l "$ZIP_FILE" | head -100

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bongkar proyek
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "=== STRUKTUR PROYEK ==="
          find project -maxdepth 5 -type f | sort | head -200

          PROJECT_DIR=$(find project \
            -type f \
            -name 'settings.gradle' \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Proyek ditemukan di:"
          echo "$PROJECT_DIR"

      - name: Aktifkan AndroidX
        shell: bash
        run: |
          set -e

          touch "$PROJECT_DIR/gradle.properties"

          sed -i '/^android.useAndroidX=/d' \
            "$PROJECT_DIR/gradle.properties"

          sed -i '/^android.enableJetifier=/d' \
            "$PROJECT_DIR/gradle.properties"

          echo "android.useAndroidX=true" \
            >> "$PROJECT_DIR/gradle.properties"

          echo "android.enableJetifier=true" \
            >> "$PROJECT_DIR/gradle.properties"

          echo ""
          echo "=== gradle.properties ==="
          cat "$PROJECT_DIR/gradle.properties"

      - name: Perbaiki MainActivity
        shell: bash
        run: |
          set -e

          FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name 'MainActivity.java' \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: MainActivity.java tidak ditemukan."
            exit 1
          fi

          echo "MainActivity:"
          echo "$FILE"

          # Perbaiki setTextStyle jika masih ada
          sed -i \
            's/\.setTextStyle(android\.graphics\.Typeface\.BOLD);/\.setTypeface(null, android.graphics.Typeface.BOLD);/g' \
            "$FILE"

          # Tambahkan import GradientDrawable jika belum ada
          if ! grep -q \
            '^import android.graphics.drawable.GradientDrawable;' \
            "$FILE"; then

            sed -i \
              '/^package /a import android.graphics.drawable.GradientDrawable;' \
              "$FILE"
          fi

          echo ""
          echo "=== PEMERIKSAAN IMPORT ==="
          grep -n "GradientDrawable" "$FILE" || true

          echo ""
          echo "=== PEMERIKSAAN TYPEFACE ==="
          grep -nE 'setTextStyle|setTypeface' "$FILE" || true

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "       MULAI BUILD APK"
          echo "================================="

          gradle -p "$PROJECT_DIR" \
            assembleDebug \
            --no-daemon

          echo ""
          echo "================================="
          echo "       APK HASIL BUILD"
          echo "================================="

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name '*.apk' \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Absen-CV-Hikmah-Tani-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
