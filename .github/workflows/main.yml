name: Build APK Absen CV Hikmah Tani

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil file repository
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bongkar file ZIP proyek
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          echo "File ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

          echo "Isi proyek:"
          find project -maxdepth 3 -type f | head -100

      - name: Aktifkan AndroidX
        run: |
          echo "android.useAndroidX=true" >> project/gradle.properties
          echo "android.enableJetifier=true" >> project/gradle.properties

      - name: Perbaiki kode MainActivity
        run: |
          find project -type f -name 'MainActivity.java' -print

          FILE=$(find project -type f -name 'MainActivity.java' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "MainActivity.java tidak ditemukan"
            exit 1
          fi

          echo "Memperbaiki file: $FILE"

          sed -i 's/\.setTextStyle(android\.graphics\.Typeface\.BOLD);/.setTypeface(null, android.graphics.Typeface.BOLD);/g' "$FILE"

          echo "Pemeriksaan setTextStyle:"
          grep -n "setTextStyle\|setTypeface" "$FILE" || true

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Absen-CV-Hikmah-Tani-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
